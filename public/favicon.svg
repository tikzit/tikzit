<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="zSpider" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#80f280"/>
      <stop offset="100%" stop-color="#2ea02e"/>
    </radialGradient>
    <radialGradient id="xSpider" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="100%" stop-color="#cf2222"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background wire -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <!-- Z spider -->
  <circle cx="20" cy="32" r="12" fill="url(#zSpider)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
  <!-- X spider -->
  <circle cx="44" cy="32" r="12" fill="url(#xSpider)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
</svg>