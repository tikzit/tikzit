name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Test Suites & Benchmarks
        run: |
          npm run test
          npm run bench

      - name: Build Production Application
        run: npm run build

      - name: Verify Bundle Budget (< 2.5MB total static dist)
        run: |
          DIST_SIZE=$(du -sk dist | awk '{print $1}')
          echo "Total dist size: ${DIST_SIZE} KB"
          if [ "$DIST_SIZE" -gt 5000 ]; then
            echo "WARNING: Production bundle exceeds budget!"
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npx playwright test
        env:
          CI: true

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
